<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 1: Trang giới thiệu tương tác</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #ffffff;
        }
        header {
            background-color: #e0e0e0;
            padding: 10px;
            text-align: center;
        }
        nav {
            background-color: #d0d0d0;
            padding: 8px;
            margin-top: 5px;
        }
        nav a {
            margin-right: 15px;
            text-decoration: none;
            color: black;
        }
        main {
            padding: 15px 0;
        }
        footer {
            margin-top: 20px;
            border-top: 1px solid #ccc;
            padding-top: 10px;
            text-align: center;
        }
        button {
            padding: 8px 15px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body id="myBody">

    <header>
        <h1>Trang Giới Thiệu Bản Thân</h1>
    </header>

    <nav>
        <a href="#trangchu">Trang chủ</a>
        <a href="#thongtin">Thông tin</a>
        <a href="#lienhe">Liên hệ</a>
    </nav>

    <main>
        <h2 id="loiChao">Xin chào!</h2>

        <p>Đây là trang web cá nhân đơn giản phục vụ bài thực hành môn Lập trình Web.</p>
        <button id="btnDoiMau">Đổi màu nền</button>
    </main>

    <footer>
        <p>© 2026 - Bài tập thực hành 1</p>
    </footer>

    <script>  
        var now = new Date();
        var gio = now.getHours();
        var theLoiChao = document.getElementById("loiChao");

        if (gio < 12) {
            theLoiChao.innerText = "Chào buổi sáng!";
        } else if (gio < 18) {
            theLoiChao.innerText = "Chào buổi chiều!";
        } else {
            theLoiChao.innerText = "Chào buổi tối!";
        }     
        var nutBam = document.getElementById("btnDoiMau");
        nutBam.addEventListener("click", function() {
            var body = document.getElementById("myBody");
            if (body.style.backgroundColor == "lightblue") {
                body.style.backgroundColor = "lightyellow";
            } else {
                body.style.backgroundColor = "lightblue";
            }
        });
    </script>
</body>
</html>
